<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - ServeLens AI</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #111;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #f59e0b; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }
        input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #f59e0b; }
        .btn {
            width: 100%;
            padding: 12px;
            background: #f59e0b;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
        }
        .btn:hover { background: #d97706; }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
        .links a { color: #f59e0b; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Panel Login</h1>
        <p style="color:#aaa; font-size: 0.9rem; margin-bottom: 25px;">Enter system administrator credentials.</p>
        
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/admin/login" method="POST">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="links">
            <a href="/login">← Back to User Login</a>
        </div>
    </div>
</body>
</html>
