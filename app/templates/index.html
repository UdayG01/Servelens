<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servelens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=2" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">▣</span>
      <span class="brand-name">ServeLens<span class="brand-thin"> AI</span></span>
      <span class="brand-rev">v1.0</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="actions">
      <!-- <a href="/faces" class="btn" style="text-decoration: none;">⊙ Face Management</a> -->
      <button id="btnTestEmail" class="btn">⌁ Test Email</button>
      <button id="btnRefresh" class="btn">↻ Refresh</button>
    </div>
  </header>

  <main class="layout">
    <section class="grid-wrap">
      <div class="section-head">
        <h2>LIVE FEEDS</h2>
        <span class="meta" id="cameraCount">0 cameras</span>
      </div>
      <div class="grid" id="cameraGrid"></div>
    </section>

    <aside class="sidebar">
      <div class="section-head">
        <h2>ALERT LOG</h2>
        <span class="meta" id="alertCount">0</span>
      </div>
      <div class="alerts-list" id="alertsList">
        <div class="empty">No alerts yet.</div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Snapshot lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-inner">
      <button class="lb-close" id="lbClose">×</button>
      <img id="lbImg" alt="" />
      <div class="lb-meta" id="lbMeta"></div>
    </div>
  </div>



  <script src="/static/app.js?v=2"></script>
</body>
</html>
