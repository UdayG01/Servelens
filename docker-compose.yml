services:
  deepstack:
    image: ${DEEPSTACK_IMAGE:-deepquestai/deepstack}
    container_name: deepstack
    restart: unless-stopped
    environment:
      - VISION-FACE=True
      - VISION-DETECTION=True
    volumes:
      - deepstack_data:/datastore
      - ./deepstack_models:/modelstore/detection
    ports:
      - "80:5000"

volumes:
  deepstack_data:
